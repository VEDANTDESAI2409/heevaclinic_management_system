services:
  - type: web
    name: heeva-clinic
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: heeva-data
      mountPath: /data
      sizeGB: 1
